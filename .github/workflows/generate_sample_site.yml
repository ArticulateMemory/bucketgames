name: Deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["develop"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: init bucket 
        run: uv run pybucketgames example init

      - name: add sample example game 
        run: uv run pybucketgames example add example-game --use-sample-assets
        
      - name: set base_url
        run: sed -i "s/https:\/\/www.example.changeme\//https:\/\/articulatememory.github.io\/pybucketgames\//" ./example/bucket.toml
        
      - name: generate
        run: uv run pybucketgames example generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./example/_website
        
  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
